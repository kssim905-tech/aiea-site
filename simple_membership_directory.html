        function renderTable(data) {
            const tableBody = document.getElementById('tableBody');
            const rowCount = document.getElementById('rowCount');
            const emptyState = document.getElementById('emptyState');

            rowCount.textContent = data.length;

            if (data.length === 0) {
                tableBody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            tableBody.innerHTML = data.map(m => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-4 py-3 font-medium text-gray-500">${m.id}</td>
                    <td class="px-4 py-3 font-semibold text-gray-900">${m.name}</td>
                    <td class="px-4 py-3 text-gray-600">${m.address}</td>
                    <td class="px-4 py-3 text-gray-700 whitespace-nowrap">${m.tel}</td>
                    <td class="px-4 py-3 text-blue-600">${m.email}</td>
                    <td class="px-4 py-3 text-gray-700 whitespace-nowrap">${m.fax}</td>
                </tr>
            `).join('');
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = membersData.filter(m => 
                m.name.toLowerCase().includes(query) ||
                m.address.toLowerCase().includes(query) ||
                m.tel.toLowerCase().includes(query) ||
                m.email.toLowerCase().includes(query) ||
                m.fax.toLowerCase().includes(query)
            );
            renderTable(filtered);
        }

        // Initialize table on load
        window.onload = function() {
            renderTable(membersData);
        };
